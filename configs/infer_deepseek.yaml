method: generation
common:
  model_name: deepseek-ai/deepseek-math-7b-instruct
  problem_dataset: data/canonical_math_paired.jsonl
  seed: 42
  dtype: float16
  max_model_len: 4096
  gpu_memory_utilization: 0.9
greedy:
  baseline: base
  backend: vllm
  output_dir: output/deepseek-math/base
  max_new_tokens: 2048
  batch_size: 128
  max_num_seqs: 64
  max_num_batched_tokens: 8192
sampling:
  output_dir: output/deepseek-math/multiple_n16
  sampled_variants: [simple, hard]
  samples_per_problem: 16
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 4096
